services:
  - type: web
    name: jumapp-api
    runtime: docker
    region: oregon
    plan: free
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        sync: false
        value: ""  # Set via Render dashboard (secret)
      - key: DEBUG
        value: "false"
      - key: DB_AUTO_CREATE
        value: "false"
      - key: AUTH_MODE
        value: dev
      - key: SUPER_ADMIN_TOKEN
        sync: false
        value: ""  # Set via Render dashboard (secret)
      - key: CORS_ORIGINS
        value: https://jumapp.netlify.app
      - key: REDIS_URL
        sync: false
        value: ""  # Phase 2: Upstash Redis URL
      - key: UPLOAD_DIR
        value: uploads
      - key: UPLOAD_URL_PREFIX
        value: /uploads
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "5242880"
      - key: MAX_PHOTOS_PER_MASJID
        value: "5"