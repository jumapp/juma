name: Reusable - EAS Build & Submit

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform to build: android or ios.'
        required: true
        type: string
      profile:
        description: 'EAS build profile from eas.json.'
        required: false
        type: string
        default: 'production'
      submit:
        description: 'Whether to submit the build to the app store after it completes.'
        required: false
        type: boolean
        default: false
      EXPO_PUBLIC_API_URL:
        description: 'API URL for web builds (EXPO_PUBLIC_API_URL).'
        required: false
        type: string
        default: ''
      EXPO_PUBLIC_API_URL_MOBILE:
        description: 'API URL for mobile builds (EXPO_PUBLIC_API_URL_MOBILE).'
        required: false
        type: string
        default: ''
    secrets:
      EXPO_TOKEN:
        description: 'Expo access token for EAS authentication.'
        required: true
      GOOGLE_SERVICE_ACCOUNT_JSON:
        description: 'Play Console service account JSON (required for Android store submission).'
        required: false
      APPLE_API_KEY:
        description: 'App Store Connect API key .p8 content (required for iOS store submission).'
        required: false
      APPLE_API_KEY_ID:
        description: 'App Store Connect API key ID (required for iOS store submission).'
        required: false
      APPLE_API_ISSUER:
        description: 'App Store Connect API key issuer ID (required for iOS store submission).'
        required: false

jobs:
  eas-build:
    name: EAS build (${{ inputs.platform }} / ${{ inputs.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure EAS CLI
        run: npx eas-cli@latest --version

      - name: Build ${{ inputs.platform }} (EAS)
        run: npx eas-cli@latest build -p ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ inputs.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_API_URL_MOBILE: ${{ inputs.EXPO_PUBLIC_API_URL_MOBILE }}

      - name: Submit ${{ inputs.platform }} to store (EAS)
        if: inputs.submit == true
        run: npx eas-cli@latest submit -p ${{ inputs.platform }} --profile ${{ inputs.profile }} --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
